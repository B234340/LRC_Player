name: Release Builds

"on":
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BINARY_NAME: lrc_player

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset_name: lrc_player-x86_64-unknown-linux-gnu.tar.gz
            archive_type: tar.gz
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            asset_name: lrc_player-x86_64-pc-windows-gnu.zip
            archive_type: zip
          - target: x86_64-apple-darwin
            runner: macos-14
            asset_name: lrc_player-x86_64-apple-darwin.tar.gz
            archive_type: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-14
            asset_name: lrc_player-aarch64-apple-darwin.tar.gz
            archive_type: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Windows GNU linker
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Ensure scripts are executable
        run: chmod +x build_release_binaries.sh

      - name: Build release binary
        env:
          TARGETS: ${{ matrix.target }}
        run: ./build_release_binaries.sh

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/${{ matrix.target }}
          cp releases/${{ matrix.target }}/* dist/${{ matrix.target }}/

          if [[ "${{ matrix.archive_type }}" == "zip" ]]; then
            cd dist/${{ matrix.target }}
            zip -9 -r ../${{ matrix.asset_name }} .
          else
            tar -C dist/${{ matrix.target }} -czf dist/${{ matrix.asset_name }} .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show release files
        run: find dist -type f | sort

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*