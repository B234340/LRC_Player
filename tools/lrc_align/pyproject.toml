[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lrc-align"
version = "0.1.0"
description = "Generate per-character (karaoke) timing for line-based LRC files from the audio"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Audio + models. CPU-only PyTorch: pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = ["stable-ts>=2.17", "demucs>=4.0", "soundfile>=0.12", "numpy"]
test = ["pytest"]

[project.scripts]
lrc-align = "lrc_align.cli:main"

[tool.setuptools]
packages = ["lrc_align"]
