[package]
name = "lrc_player"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.16"
crossbeam-queue = "0.3"
dirs = "6.0"
eframe = "0.33"
lofty = "0.21"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
log = "0.4"

[dev-dependencies]
hound = "3.5"
tempfile = "3.15"
