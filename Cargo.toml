[package]
name = "lrc_player"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "net", "io-util"] }
rusqlite = { version = "0.29", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
blake3 = "1.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
# Audio decoding / format parsing (symphonia family)
symphonia = "0.5"
thiserror = "1.0"
rand = "0.8"
hex = "0.4"
tempfile = { version = "3", optional = true }
ringbuf = "0.2"
crossbeam-channel = "0.5"
directories = "4"
eframe = "0.22"

[dev-dependencies]
tempfile = "3"
