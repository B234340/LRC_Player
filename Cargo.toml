[package]
name = "lrc_player"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.23"
rand = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
