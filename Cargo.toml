[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/ports",
    "crates/application",
    "crates/adapters-persistence",
    "crates/adapters-audio",
    "crates/adapters-scan",
    "crates/adapters-lyrics",
    "shared/contracts",
    "crates/presentation-egui",
    "apps/gui",
    "apps/cli",
]

# Audio decoding/resampling is far too slow unoptimized (symphonia + rubato run
# near realtime in debug), which causes dropouts in `cargo run` builds.
# Optimize all dependencies and the audio adapter even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.lrc_player_adapters_audio]
opt-level = 3
